# stamp — https://github.com/p-arndt/stamp
#
# There is exactly ONE version number for the whole suite: root Cargo.toml's
# [workspace.package] version, which every crate inherits via
# `version.workspace = true`, and which every image is tagged with.
#
# Cargo.lock also carries that number, once per workspace member, in
# `[[package]]` entries stamp does not rewrite. The after_write hook refreshes
# them, and stamp puts the updated Cargo.lock into the release commit.

project: minisuite

version:
  - Cargo.toml#workspace.package.version

release:
  branch: main
  remote: origin
  tag: "v{{ version }}"
  commit: "release: {{ tag }}"
  push: true
  prerelease: beta

hooks:
  after_write:
    - cargo update --workspace
