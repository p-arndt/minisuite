name: Build and Publish Release

permissions:
  contents: write
  packages: write

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.2.0 or 0.2.0-beta.1 ("v" prefix optional). Leave empty to use the Cargo.toml version with a -pre.<run> suffix.'
        required: false
        type: string
      prerelease:
        description: 'Mark as a GitHub pre-release'
        required: false
        type: boolean
        default: true
      draft:
        description: 'Create as a draft so you can review/publish it manually'
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the version and release metadata once, so every downstream job
  # agrees on the tag, prerelease/draft flags, and the release notes.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version + flags
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              # No version given: derive from the Cargo.toml version and suffix
              # with the semver pre-release id "-pre.<run>" so each manual run
              # gets its own, ever-incrementing version.
              PKG_VERSION=$(node -e "import('./scripts/set-version.mjs').then(m => console.log(m.readVersion()))")
              VERSION="${PKG_VERSION}-pre.${{ github.run_number }}"
            fi
            [[ "$VERSION" == v* ]] || VERSION="v$VERSION"
            PRERELEASE="${{ inputs.prerelease }}"
            DRAFT="${{ inputs.draft }}"
          else
            VERSION="${GITHUB_REF_NAME}"
            DRAFT=false
            # Semver pre-release tags (e.g. v0.2.0-beta.1) are flagged automatically.
            if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          fi
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT"           >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          # Range = commits since the previous tag (falls back to the whole
          # history for the very first release).
          PREV_TAG=$(git tag --sort=-creatordate | grep -vFx "$VERSION" | head -n1 || true)
          if [ -n "$PREV_TAG" ]; then RANGE="${PREV_TAG}..HEAD"; else RANGE="HEAD"; fi

          if [ "$PRERELEASE" = "true" ]; then
            echo "## Pre-release $VERSION" > RELEASE_NOTES.md
          else
            echo "## Release $VERSION" > RELEASE_NOTES.md
          fi
          echo "" >> RELEASE_NOTES.md
          git log --no-merges --pretty='- %s (%h)' $RANGE >> RELEASE_NOTES.md || true

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  # ---------------------------------------------------------------------------
  # Build the `minicloak` binary for each target.
  #
  # minicloak has no dependencies and links nothing but libc, so there are no
  # system packages to install and the musl targets produce fully static binaries.
  # ---------------------------------------------------------------------------
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Cross-link aarch64 with rust's bundled lld instead of a cross gcc: there
      # is no C code in the tree, so nothing else is needed.
      - name: Use rust-lld for the aarch64 cross build
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C linker=rust-lld" >> "$GITHUB_ENV"

      # Statically link the MSVC runtime -> a self-contained minicloak.exe with
      # no vcruntime DLL dependency.
      - name: Set Windows static CRT
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          V: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          NAME="minicloak-${V}-${TARGET}"
          mkdir -p "dist/$NAME"
          cp "target/${TARGET}/release/minicloak" "dist/$NAME/"
          cp README.md LICENSE minicloak.example.toml "dist/$NAME/" 2>/dev/null || true
          tar -C dist -czf "dist/${NAME}.tar.gz" "$NAME"
          ls -l dist

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          V: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $NAME = "minicloak-$env:V-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "dist/$NAME" | Out-Null
          Copy-Item "target/$env:TARGET/release/minicloak.exe" "dist/$NAME/"
          Copy-Item README.md, LICENSE, minicloak.example.toml "dist/$NAME/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$NAME/*" -DestinationPath "dist/$NAME.zip" -Force
          Get-ChildItem dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # ---------------------------------------------------------------------------
  # Publish the scratch container image to GitHub Container Registry.
  # Delete this job if you do not want to publish images.
  # ---------------------------------------------------------------------------
  image:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for the arm64 image)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        env:
          V: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="${REPO}:${V#v}"
          # Only a real release moves the `latest` tag.
          if [ "$PRERELEASE" != "true" ]; then TAGS="${TAGS},${REPO}:latest"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}

  # ---------------------------------------------------------------------------
  # Collect every platform's archive + the notes, then cut the GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p dist-release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} dist-release/ \;
          ls -l dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          body_path: artifacts/release-notes/RELEASE_NOTES.md
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          draft: ${{ needs.prepare.outputs.draft }}
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
