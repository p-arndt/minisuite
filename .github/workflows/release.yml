name: Release

# The version is decided on the maintainer's machine by `just release`, which
# stamps Cargo.toml, refreshes Cargo.lock, commits, tags `v<x.y.z>` and pushes.
# This workflow only reacts to that tag: the shared rust-release workflow
# verifies the tag, builds one archive per target holding all four binaries,
# publishes the four scratch images to ghcr.io and cuts the GitHub Release.

on:
  push:
    tags: ['v*']

jobs:
  release:
    uses: p-arndt/.github/.github/workflows/rust-release.yml@v1
    permissions:
      contents: write
      packages: write
    with:
      name: minisuite
      binaries: minicloak minimail minibucket minisuite
      extra-files: >-
        README.md LICENSE minisuite.example.toml crates/minicloak/minicloak.example.toml
        crates/minimail/creds.example=minimail.creds.example
        crates/minibucket/creds.example=minibucket.creds.example
      images: '["minicloak", "minimail", "minibucket", "minisuite"]'
