name: Build and Publish Release

# The version is decided on the maintainer's machine by `just release`, which
# stamps Cargo.toml, refreshes Cargo.lock, commits, tags `v<x.y.z>` and pushes.
# This workflow only reacts to that tag: it verifies the tag against the
# committed version, builds, and publishes. It never decides a version.

permissions:
  contents: write
  packages: write

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Verify the tag against Cargo.toml's [workspace.package] version and publish
  # the resulting metadata, so every downstream job agrees on the version, the
  # prerelease flag and the release notes (which stamp wrote into the annotated
  # tag's message).
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      tag: ${{ steps.stamp.outputs.tag }}
      prerelease: ${{ steps.stamp.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Fails the whole release if the tag and the committed version disagree.
      - uses: p-arndt/stamp@v0
        id: stamp

      # notes-file is a path inside this job, so it has to travel as an artifact.
      - name: Stage the release notes
        run: cp "${{ steps.stamp.outputs.notes-file }}" RELEASE_NOTES.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  # ---------------------------------------------------------------------------
  # Build ALL FOUR binaries for each target and ship them as one archive per
  # target: the suite is released as a unit, so `minisuite-<v>-<target>.tar.gz`
  # contains minicloak, minimail, minibucket and minisuite together.
  #
  # Every crate builds from std alone, so there are no system packages to
  # install and the musl targets produce fully static binaries.
  # ---------------------------------------------------------------------------
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Cross-link aarch64 with rust's bundled lld instead of a cross gcc: there
      # is no C code in the tree, so nothing else is needed.
      - name: Use rust-lld for the aarch64 cross build
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C linker=rust-lld" >> "$GITHUB_ENV"

      # Statically link the MSVC runtime -> self-contained .exe files with no
      # vcruntime DLL dependency.
      - name: Set Windows static CRT
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --workspace --locked --target ${{ matrix.target }}

      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          V: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          NAME="minisuite-${V}-${TARGET}"
          mkdir -p "dist/$NAME"
          for bin in minicloak minimail minibucket minisuite; do
            cp "target/${TARGET}/release/$bin" "dist/$NAME/"
          done
          cp README.md LICENSE "dist/$NAME/"
          # Example configs are best-effort: a crate may not ship one.
          cp crates/minicloak/minicloak.example.toml "dist/$NAME/" 2>/dev/null || true
          for c in crates/*/creds.example; do
            [ -f "$c" ] && cp "$c" "dist/$NAME/$(basename "$(dirname "$c")").creds.example" || true
          done
          cp minisuite.example.toml "dist/$NAME/" 2>/dev/null || true
          tar -C dist -czf "dist/${NAME}.tar.gz" "$NAME"
          ls -l dist

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          V: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $NAME = "minisuite-$env:V-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "dist/$NAME" | Out-Null
          foreach ($bin in "minicloak", "minimail", "minibucket", "minisuite") {
            Copy-Item "target/$env:TARGET/release/$bin.exe" "dist/$NAME/"
          }
          Copy-Item README.md, LICENSE "dist/$NAME/"
          Copy-Item "crates/minicloak/minicloak.example.toml" "dist/$NAME/" -ErrorAction SilentlyContinue
          Get-ChildItem "crates/*/creds.example" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "dist/$NAME/$($_.Directory.Name).creds.example"
          }
          Copy-Item "minisuite.example.toml" "dist/$NAME/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$NAME/*" -DestinationPath "dist/$NAME.zip" -Force
          Get-ChildItem dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # ---------------------------------------------------------------------------
  # Publish the four scratch images to GitHub Container Registry. They all come
  # out of the same multi-target root Dockerfile, one `target:` per image.
  # ---------------------------------------------------------------------------
  image:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [minicloak, minimail, minibucket, minisuite]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for the arm64 image)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        env:
          V: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          IMAGE: ${{ matrix.image }}
        run: |
          REPO="ghcr.io/p-arndt/${IMAGE}"
          TAGS="${REPO}:${V}"
          # Only a real release moves the `latest` tag.
          if [ "$PRERELEASE" != "true" ]; then TAGS="${TAGS},${REPO}:latest"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}

  # ---------------------------------------------------------------------------
  # Collect every platform's archive + the notes, then cut the GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p dist-release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} dist-release/ \;
          ls -l dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: artifacts/release-notes/RELEASE_NOTES.md
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
